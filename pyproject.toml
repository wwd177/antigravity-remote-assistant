[project]
name = "antigravity-remote-assistant"
version = "0.2.0"
description = "反重力助手 (Antigravity Assistant) — Mobile/Web PWA remote control, full Antigravity & Codex PC conversation sync, and Git diff inspector"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0.1",
    "segno>=1.6.1",
    "websockets>=14.0",
]

[project.scripts]
antigravity-assistant = "qq_agy_bridge.main:main"
agy-bridge-setup = "qq_agy_bridge.setup_wizard:main"
qq-agy-bridge = "qq_agy_bridge.main:main"

[project.gui-scripts]
antigravity-launcher = "qq_agy_bridge.launcher:main"
qq-agy-launcher = "qq_agy_bridge.launcher:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qq_agy_bridge"]
